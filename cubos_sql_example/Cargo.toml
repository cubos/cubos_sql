[package]
name = "cubos_sql_example"
version = "0.1.0"
edition = "2024"

[dependencies]
cubos_sql = { path = "../cubos_sql" }
deadpool-postgres = "0.14"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"

# Same crate + features as the runtime dependency, so Cargo reuses the
# compiled artifact instead of building it twice. `build.rs` calls
# `cubos_sql::build::track_migrations()` to rebuild when migrations change.
[build-dependencies]
cubos_sql = { path = "../cubos_sql" }

[package.metadata.cubos_sql.database]
migrations = "./migrations"
