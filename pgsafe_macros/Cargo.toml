[package]
name = "pgsafe_macros"
version = "0.1.0"
edition = "2024"
description = "Proc macros for pgsafe"

[lib]
proc-macro = true

[dependencies]
pgsafe_core = { path = "../pgsafe_core" }
pgsafe_analyzer = { path = "../pgsafe_analyzer" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
