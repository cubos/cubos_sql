[package]
name = "cubos_sql_analyzer"
version = "0.1.0"
edition = "2024"
description = "Static SQL type and nullability analyzer for cubos_sql"

[features]
internal = []

[dependencies]
cubos_sql_core = { path = "../cubos_sql_core" }
pg_query = "6"
prost = "0.13"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_tuple = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
cubos_sql_analyzer = { path = ".", features = ["internal"] }
