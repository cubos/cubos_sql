[package]
name = "cubos_sql"
version = "0.1.0"
edition = "2024"
description = "Typed PostgreSQL access with compile-time verification"

[features]
default = ["deadpool"]
deadpool = ["dep:deadpool-postgres"]
bb8 = ["dep:bb8", "dep:bb8-postgres"]

[dependencies]
cubos_sql_core = { path = "../cubos_sql_core" }
cubos_sql_macros = { path = "../cubos_sql_macros" }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
deadpool-postgres = { version = "0.14", optional = true }
bb8 = { version = "0.9", optional = true }
bb8-postgres = { version = "0.9", optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
md5 = "0.8"
bytes = "1"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tempfile = "3"
