[package]
name = "pgsafe_seed"
version = "0.1.0"
edition = "2024"
description = "Generates seed.json for pgsafe_analyzer from a live PostgreSQL instance"
publish = false

[dependencies]
pgsafe_analyzer = { path = "../pgsafe_analyzer", features = ["internal"] }
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
