[package]
name = "cubos_sql_macros"
version = "0.1.0"
edition = "2021"
description = "Proc macros for cubos_sql"

[lib]
proc-macro = true

[dependencies]
cubos_sql_core = { path = "../cubos_sql_core" }
cubos_sql_analyzer = { path = "../cubos_sql_analyzer" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
postgres = "0.19"
sha2 = "0.10"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
